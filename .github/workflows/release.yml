name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: myna
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: myna.exe
          - target: x86_64-apple-darwin
            os: macos-latest
            bin: myna

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../myna-${{ github.ref_name }}-${{ matrix.target }}.zip ${{ matrix.bin }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: myna-${{ matrix.target }}
          path: myna-${{ github.ref_name }}-${{ matrix.target }}.zip

  build-mpa:
    needs: sign-extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build mpa
        run: cargo build --release -p mpa

      - name: Download signed extension
        uses: actions/download-artifact@v8
        with:
          name: mpa-extension

      - name: Package mpa
        run: |
          mkdir -p mpa-${{ github.ref_name }}-linux
          cp target/release/mpa mpa-${{ github.ref_name }}-linux/
          cp mpa/README.md mpa-${{ github.ref_name }}-linux/
          cp mpa/install.sh mpa-${{ github.ref_name }}-linux/
          cp -r mpa/extension mpa-${{ github.ref_name }}-linux/
          cp mpa-extension-${{ github.ref_name }}.xpi mpa-${{ github.ref_name }}-linux/
          tar czf mpa-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz mpa-${{ github.ref_name }}-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mpa-linux
          path: mpa-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz

  sign-extension:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # AMOは同一バージョンの再アップロードを拒否するため、
      # 拡張を変更したらmanifest.jsonのversionを上げる必要がある
      # (拡張のバージョンはマイナポータル側の判定に合わせているためタグとは独立)
      - name: Show extension version
        run: node -p "require('./mpa/extension/manifest.json').version"

      - name: Sign extension
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          npx --yes web-ext@8 sign \
            --source-dir mpa/extension \
            --channel unlisted \
            --artifacts-dir dist

      - name: Rename artifact
        run: mv dist/*.xpi mpa-extension-${{ github.ref_name }}.xpi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mpa-extension
          path: mpa-extension-${{ github.ref_name }}.xpi

  release:
    needs: [build, build-mpa, sign-extension]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            myna-*
            mpa-v*.tar.gz
